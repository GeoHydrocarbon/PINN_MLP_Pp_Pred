data:
  csv_file: data/processed/N873_fortrain_Ip.csv
  sequence_length: 10
  train_ratio: 0.8
model:
  dropout: 0.15
  hidden_size: 256
  input_size: 4
  mlp_hidden_sizes:
  - 256
  - 64
  num_layers: 3
  type: mlp
physics:
  eaton_exponent: 2
  fluid_density: 1.03
  gravity: 9.8
  nac_a: -0.0001995
  nac_b: 5.0099
  rho_rock: 2.35
training:
  batch_size: 32
  data_weight: 0.9
  early_stopping_patience: 15
  epochs: 100
  grad_clip: 1.0
  learning_rate: 0.001
  scheduler:
    factor: 0.5
    min_lr: 1.0e-05
    patience: 10
  seed: 42
